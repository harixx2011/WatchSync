<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>WatchSync</title>
</head>
<body>
    <div id="WatchSyncConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-select,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <form id="WatchSyncConfigForm">
                    <div class="selectContainer">
                        <label class="selectLabel" for="Options">Sync User</label>
                        <select is="emby-select" id="SyncUser" name="Options" class="emby-select-withcolor emby-select">
                        </select>
                    </div>
                    <div>
                    <div class="selectContainer">
                        <label class="selectLabel" for="Options">Several Options</label>
                        <select is="emby-select" id="Options" name="Options" class="emby-select-withcolor emby-select">
                            <option id="optOneOption" value="OneOption">One Option</option>
                            <option id="optAnotherOption" value="AnotherOption">Another Option</option>
                        </select>
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="AnInteger">An Integer</label>
                        <input id="AnInteger" name="AnInteger" type="number" is="emby-input" min="0" step="1" required />
                        <div class="fieldDescription">A Description</div>
                    </div>
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input id="TrueFalseSetting" name="TrueFalseCheckBox" type="checkbox" is="emby-checkbox" />
                            <span>A Checkbox</span>
                        </label>
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="AString">A String</label>
                        <input id="AString" name="AString" type="text" is="emby-input" />
                        <div class="fieldDescription">Another Description</div>
                    </div>
                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span>Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <script type="text/javascript">
            var WatchSyncConfig = {
                pluginUniqueId: 'c035a825-eb06-49b4-a962-3703d4acb177'
            };

            ApiClient.getUsers().then((users) => {

              console.log(users);

              let syncuser = document.querySelector('#SyncUser');
              users.forEach(user => {
                console.log(user)
                let opt = document.createElement('option');
                opt.value = user.Id;
                opt.innerHTML = user.Name;
                syncuser.appendChild(opt);
              })
            })


            document.querySelector('#WatchSyncConfigPage')
                .addEventListener('pageshow', function() {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(WatchSyncConfig.pluginUniqueId).then(function (config) {
                        document.querySelector('#Options').value = config.Options;
                        document.querySelector('#AnInteger').value = config.AnInteger;
                        document.querySelector('#TrueFalseSetting').checked = config.TrueFalseSetting;
                        document.querySelector('#AString').value = config.AString;
                        Dashboard.hideLoadingMsg();
                    }).catch(function () {
                        Dashboard.hideLoadingMsg();
                        Dashboard.alert('Unable to load WatchSync configuration. Check the Jellyfin server log.');
                    });
                });

            document.querySelector('#WatchSyncConfigForm')
                .addEventListener('submit', function(e) {
                e.preventDefault();
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(WatchSyncConfig.pluginUniqueId).then(function (config) {
                    config.Options = document.querySelector('#Options').value;
                    config.AnInteger = document.querySelector('#AnInteger').valueAsNumber;
                    config.TrueFalseSetting = document.querySelector('#TrueFalseSetting').checked;
                    config.AString = document.querySelector('#AString').value;
                    return ApiClient.updatePluginConfiguration(WatchSyncConfig.pluginUniqueId, config).then(function (result) {
                        Dashboard.processPluginConfigurationUpdateResult(result);
                    });
                }).catch(function () {
                    Dashboard.hideLoadingMsg();
                    Dashboard.alert('Unable to save WatchSync configuration. Check the Jellyfin server log.');
                });

                return false;
            });
        </script>
    </div>
</body>
</html>
